<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abdullah Sulehri · Marketing Strategist</title>
<meta name="description" content="Senior Marketing Manager in Lahore. B2B growth across Pakistan and the UAE, and AI agents and automations for marketing teams.">
<meta property="og:title" content="Abdullah Sulehri · Marketing Strategist">
<meta property="og:description" content="B2B growth leader building marketing engines with AI.">
<meta property="og:image" content="assets/portrait.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2324221F'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%231F4E8C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen poster hero (name, photo, tiles, panels), then cream / white / ink sections. Paper look, one accent. */
:root{--paper:#EEE8DD;--card:#FAF8F4;--ink:#24221F;--ink-2:#5B574F;--ink-3:#8A847A;--line:rgba(36,34,31,.14);--band:#1E1D1B;
  --accent:#1F4E8C;--on-accent:#fff;--tint:color-mix(in srgb,var(--accent) 7%,#fff);--tint-2:color-mix(in srgb,var(--accent) 14%,#fff);
  --f-display:'Oswald','Arial Narrow',sans-serif;--f-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --bg-tex:url(assets/bg_cream.webp);--card-tex:url(assets/card_white.webp);--bar:52px;--nav:60px;--r:12px;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav) + 8px)}
body{margin:0;background:var(--paper) var(--bg-tex) center/700px;color:var(--ink);font:15.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:rgba(238,232,221,.62);z-index:-1;pointer-events:none}
img{max-width:100%}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 12px;font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.h1{margin:0;font:700 clamp(34px,4.6vw,62px)/.98 var(--f-display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.h1 em,.thesis em{font-style:normal;color:var(--accent)}
.lead{margin:12px 0 0;max-width:62ch;color:var(--ink-2);font-size:16.5px}
.muted{color:var(--ink-3)}
.sec{position:relative;padding-block:clamp(64px,9vw,120px)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 28px;margin-bottom:clamp(24px,3vw,40px)}
.sec-head>div{min-width:0}
.sec-head .note{font-size:13.5px;color:var(--ink-3)}
.sec.white{background:var(--card) var(--card-tex) center/640px}
.sec.white::before{content:"";position:absolute;inset:0;background:rgba(250,248,244,.7);pointer-events:none}
.sec>.wrap{position:relative}
/* surfaces */
.card{position:relative;isolation:isolate;min-width:0;background:var(--card) var(--card-tex) center/520px;border:1px solid rgba(36,34,31,.09);border-radius:var(--r);padding:clamp(18px,1.8vw,24px);box-shadow:0 1px 2px rgba(36,34,31,.06),0 12px 26px -20px rgba(36,34,31,.45)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(252,251,248,.5);z-index:-1;pointer-events:none}
.sec.white .card{background:#fff;box-shadow:0 1px 2px rgba(36,34,31,.06),0 14px 30px -22px rgba(36,34,31,.5)}
.sec.white .card::before{display:none}
.inner{background:var(--tint);border-radius:10px;padding:14px 16px}
.ct{font:700 clamp(18px,1.5vw,22px)/1.05 var(--f-display);text-transform:uppercase;margin:0;letter-spacing:.01em}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;font:600 14px var(--f-body);text-decoration:none;border:1.5px solid var(--ink);background:transparent;white-space:nowrap;transition:transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{height:36px;padding:0 15px;font-size:13px}
/* standard action control: icon circle that opens into a labelled pill */
.pa{--h:32px;display:inline-flex;align-items:center;height:var(--h);border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;text-decoration:none;font:600 12.5px var(--f-body);white-space:nowrap;padding:0;cursor:pointer;flex:none;transition:background .2s,color .2s}
.pa .ic{width:calc(var(--h) - 3px);height:calc(var(--h) - 3px);display:grid;place-items:center;flex:none;font-size:14px;line-height:1}
.pa .lb{max-width:0;overflow:hidden;transition:max-width .42s cubic-bezier(.3,1.25,.5,1),padding .42s;padding-right:0}
.pa:hover,.pa:focus-visible,.open-row:hover .pa,.pa.on{background:var(--accent);color:var(--on-accent)}
.pa:hover .lb,.pa:focus-visible .lb,.open-row:hover .pa .lb,.pa.on .lb,.pa.wide .lb{max-width:190px;padding-right:13px}
.pa.wide{background:transparent;color:var(--accent)}
.pa.wide:hover{background:var(--accent);color:var(--on-accent)}
@media (hover:none){.pa .lb{max-width:190px;padding-right:13px}.tile:hover .tdot{width:9px!important;height:9px!important;background:var(--ink-3)!important}.tile:hover .tdot::after{font-size:0!important}.cc:hover .node{min-width:12px!important;height:12px!important;top:-27px!important;font-size:0!important;padding:0!important;background:var(--paper)!important;border-color:var(--ink-3)!important}}

/* status */
.status{display:inline-flex;align-items:center;gap:9px;padding:7px 14px 7px 11px;border-radius:999px;background:rgba(252,251,248,.85);border:1px solid var(--line);font:500 13px var(--f-body);white-space:nowrap}
.status .live{position:relative;width:9px;height:9px;border-radius:50%;background:#2F8F5B}
.status .live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid #2F8F5B;animation:pulse 2.4s cubic-bezier(.2,.7,.3,1) infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.status .sep{width:1px;height:12px;background:var(--line)}
.no-motion .status .live::after{animation:none;opacity:0}
.toggle{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.tgl{width:30px;height:18px;border-radius:999px;background:rgba(36,34,31,.2);position:relative;transition:background .25s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
[aria-pressed="true"] .tgl{background:var(--accent)}[aria-pressed="true"] .tgl::after{transform:translateX(12px)}
/* nav */
.nav{position:fixed;inset:0 0 auto;z-index:40;height:var(--nav);display:flex;align-items:center;gap:22px;padding:0 clamp(16px,2.6vw,40px);padding-top:env(safe-area-inset-top,0px);background:rgba(238,232,221,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.mono{display:inline-flex;align-items:center;gap:3px;font:700 21px/1 var(--f-display);text-decoration:none;letter-spacing:.02em}
.mono .dot{width:7px;height:7px}
.nav .links{display:flex;gap:22px;font:500 14px var(--f-body)}
.nav .links a{text-decoration:none}.nav .links a:hover{color:var(--accent)}
.nav .sp{flex:1}
/* hero */
.hero{position:relative;height:max(660px,100svh);max-height:1000px;overflow:hidden}
.name{position:absolute;left:0;right:0;top:calc(var(--nav) + 10px);margin:0;padding:0 clamp(14px,2.6vw,40px);font-family:var(--f-display);font-weight:450;line-height:.92;white-space:nowrap;text-transform:uppercase;user-select:none;letter-spacing:var(--name-ls,.01em);z-index:1}
.name .w{display:inline-block}.name .cw{display:inline-block;text-align:center;vertical-align:top}.name .ci{display:inline-block;transform-origin:50% 70%}.name .gap{display:inline-block;width:.2em}
.photo{position:absolute;z-index:3;left:50%;top:var(--ph-top,140px);bottom:calc(var(--bar) + 4px);height:calc(100% - var(--ph-top,140px) - var(--bar) - 4px);width:auto;max-width:none;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 18px 22px rgba(36,34,31,.18));object-fit:contain}
.hcopy{position:absolute;z-index:4;right:clamp(14px,2.6vw,40px);width:min(33vw,480px);top:var(--below,260px);display:grid;gap:16px;transition:opacity .3s}
.role{margin:0;font:600 11px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.thesis{margin:0;font:700 clamp(26px,2.5vw,40px)/1 var(--f-display);text-transform:uppercase;max-width:16ch;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));border-block:1px solid var(--line);padding:12px 0}
.stat{padding:0 12px;border-left:1px solid var(--line);min-width:0}.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font:700 clamp(28px,2.6vw,42px)/.95 var(--f-display);font-variant-numeric:tabular-nums}
.stat b i{font-style:normal;color:var(--accent)}
.stat span{display:block;margin-top:6px;font-size:11.5px;line-height:1.3;color:var(--ink-2)}
.tiles{position:absolute;z-index:4;left:clamp(14px,2.6vw,40px);width:min(31vw,470px);top:var(--below,260px);bottom:calc(var(--bar) + 14px);display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
.tile{position:relative;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px;padding:14px 14px 12px;min-height:0;overflow:hidden;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.tile:hover{transform:translateY(-2px)}
.tile .tl{font:600 10.5px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding-right:58px}
.tile .th{font:700 clamp(17px,1.35vw,21px)/1.02 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.tile .tp{font-size:12.5px;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:clip-path .16s,transform .16s}
.tile .tdot{position:absolute;top:14px;right:14px;height:9px;width:9px;border-radius:999px;background:var(--ink-3);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:width .42s cubic-bezier(.3,1.3,.5,1),height .42s cubic-bezier(.3,1.3,.5,1),background .2s;z-index:2}
.tile .tdot::after{content:attr(data-l);font:700 0px var(--f-body);letter-spacing:.08em;color:var(--on-accent);transition:font-size .2s}
.tile:hover .tdot,.tile:focus-visible .tdot{width:48px;height:18px;background:var(--accent)}
.tile:hover .tdot::after,.tile:focus-visible .tdot::after{font-size:9.5px}
.tile .fill{position:absolute;inset:0;background:var(--tint);border:1.5px solid var(--accent);border-radius:inherit;z-index:0;pointer-events:none;opacity:0}
.tile>*:not(.fill):not(.tdot){position:relative;z-index:1}
.tile .tp{margin-top:auto}
.tile.armed .tp{clip-path:inset(0 0 100% 0);transform:translateY(6px)}
.tile.armed .fill{opacity:1}
.tile.armed .tdot{background:var(--accent);width:9px!important;height:9px!important}.tile.armed .tdot::after{font-size:0!important}
.hbar{position:absolute;z-index:6;left:0;right:0;bottom:0;height:var(--bar);display:flex;align-items:center;gap:20px;padding:0 clamp(14px,2.6vw,40px);background:rgba(238,232,221,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);font:500 13px var(--f-body)}
.hbar .sp{flex:1}
.hbar .more{border:0;background:none;padding:0;font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center}
.swatches{position:relative}
.swp{position:absolute;bottom:calc(100% + 12px);right:0;display:flex;gap:8px;padding:10px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 26px -16px rgba(36,34,31,.5)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.hero.open .hcopy{opacity:0;pointer-events:none}
/* panel */
.panel{position:absolute;z-index:20;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--card) var(--card-tex) center/620px;box-shadow:0 30px 60px -30px rgba(36,34,31,.55),0 0 0 1.5px var(--accent);top:var(--below,260px);bottom:calc(var(--bar) + 12px);left:45vw;right:clamp(14px,2.6vw,40px)}
.panel::before{content:"";position:absolute;inset:0;background:rgba(252,251,248,.6);pointer-events:none}
.phd{position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line);background:rgba(252,251,248,.85)}
.phd .pt{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.pager{position:relative;display:inline-flex;gap:9px;align-items:center;flex:none}.pager i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pager b{position:absolute;left:-1px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--accent)}
.roll{display:inline-block;height:1.25em;overflow:hidden;vertical-align:-.3em}.roll span{display:block;line-height:1.25em}
.nb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:rgba(252,251,248,.9);font:600 13px var(--f-body);white-space:nowrap}
.nb:hover{border-color:var(--ink)}
.nb.close{background:var(--ink);border-color:var(--ink);color:#fff}
.pbody{position:relative;flex:1;overflow-y:auto;padding:22px 24px 30px;scrollbar-width:thin;scrollbar-color:rgba(36,34,31,.28) transparent;overscroll-behavior:contain}
.pbody .h1{font-size:clamp(30px,3vw,46px)}
.pgrid{display:grid;gap:14px;margin-top:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.pc{display:flex;flex-direction:column;gap:8px}
.pc p{margin:0;font-size:14.5px;color:var(--ink-2)}
.pc .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;font:600 13px/1.35 var(--f-body)}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-top:18px;background:var(--tint);border-radius:10px;padding:14px 0}
.pstats .stat{padding:0 16px}.pstats .stat:first-child{padding-left:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px var(--f-body);padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--ink)}
.rows{display:grid}
.rowx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.rows .rowx:first-child{border-top:0}
.rowx .rd{grid-column:1/-1;display:flex;gap:8px;align-items:center;font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.rowx .rt{font:700 16px/1.3 var(--f-body)}.rowx .rt span{font-weight:500;color:var(--ink-2)}
.rowx .rs{grid-column:1/-1;font-size:14px;color:var(--ink-2)}
.rowx ul{grid-column:1/-1;margin:6px 0 0;padding:12px 16px 12px 32px;background:var(--tint);border-radius:10px;font-size:13.5px;color:var(--ink-2);display:grid;gap:5px}
.now{font:600 10px var(--f-body);letter-spacing:.1em;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:2px 8px}
.graph svg{display:block;width:100%;height:auto;overflow:visible}
.graph text{font:500 11px var(--f-body);fill:var(--ink-3)}.graph .vl{font:700 13px var(--f-body);fill:var(--ink)}
.graph .ln{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.graph .tip{fill:var(--accent)}
.graph .callout{font:700 34px var(--f-display);fill:var(--accent)}
.reader h2{margin:14px 0 6px;font:700 clamp(24px,2.4vw,34px)/1.05 var(--f-display);text-transform:uppercase}
.reader p,.reader li{font-size:15.5px;line-height:1.7;max-width:68ch}.reader h3{font:700 20px var(--f-display);text-transform:uppercase;margin:22px 0 4px}
.fly{position:absolute;z-index:30;margin:0;transform-origin:0 0;pointer-events:none}
/* career */
.cs{position:relative;display:grid;grid-template-columns:repeat(var(--n,6),minmax(150px,1fr));gap:12px;overflow-x:auto;padding:30px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.cs .rail{position:absolute;left:0;right:0;top:12px;height:6px;background:radial-gradient(var(--ink-3) 1.2px,transparent 1.6px) 0 0/7px 6px;pointer-events:none}
.cs .rdot{position:absolute;top:9px;left:0;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--tint-2);pointer-events:none;z-index:2}
.cc{position:relative;scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:4px;padding:16px;font:inherit;color:inherit;overflow:visible}
.cc .node{position:absolute;top:-27px;left:16px;height:12px;min-width:12px;border-radius:999px;background:var(--paper);border:2px solid var(--ink-3);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;font:700 0px var(--f-body);color:var(--on-accent);transition:min-width .4s cubic-bezier(.3,1.3,.5,1),height .3s,top .3s,background .2s,padding .3s}
.cc:hover .node,.cc:focus-visible .node{min-width:56px;height:18px;top:-30px;background:var(--accent);border-color:var(--accent);font-size:9.5px;padding:0 8px}
.cc .yr{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.cc .ti{font:700 18px/1.02 var(--f-display);text-transform:uppercase}
.cc .co{font-size:13px;color:var(--ink-2)}
.cc[aria-expanded="true"]{background:var(--tint);border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.cc[aria-expanded="true"]::before{display:none}
.cc.isnow .yr{color:var(--accent)}
.cdet{margin-top:16px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:clamp(18px,3vw,44px);box-shadow:0 0 0 1.5px var(--accent),0 20px 40px -26px rgba(36,34,31,.5)}
.cdet .dh .yr{font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.cdet .dh h3{margin:8px 0 4px;font:700 clamp(26px,2.6vw,38px)/1 var(--f-display);text-transform:uppercase}
.cdet .dh .co{color:var(--ink-2)}
.cdet .dh .hl{margin-top:14px;font:600 17px/1.35 var(--f-body)}
.cdet .db p{margin:0;font-size:15.5px;color:var(--ink-2)}
.cdet .db ul{margin:14px 0 0;padding:14px 16px 14px 32px;background:var(--tint);border-radius:10px;display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.cnav{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line)}
/* certificates */
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.cert{display:flex;flex-direction:column;gap:12px}
.ctop{display:flex;align-items:center;gap:12px;min-width:0}
.clogo{height:54px;min-width:54px;max-width:150px;padding:10px 12px;border-radius:12px;background:var(--tint);display:grid;place-items:center;flex:none}
.clogo img{max-height:32px;max-width:120px;filter:brightness(0);opacity:.82}
.clogo .ini{font:700 15px var(--f-display);color:var(--accent);letter-spacing:.04em}
.ciss{font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);min-width:0}
.cert h3{margin:0;font:700 clamp(20px,1.6vw,24px)/1.02 var(--f-display);text-transform:uppercase}
